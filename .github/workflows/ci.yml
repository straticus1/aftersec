name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-build:
    name: Linux build (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout darkscan
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DARKSCAN_REPO }}
          token: ${{ secrets.DARKSCAN_TOKEN }}
          path: darkscan-local

      - name: Remap darkscan replace directive
        run: go mod edit -replace github.com/afterdarksys/darkscan=./darkscan-local

      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/aftersecd/... ./cmd/aftersec/... ./pkg/...

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/aftersecd/... ./cmd/aftersec/... ./pkg/...

      # Run tests natively on the linux runner — this exercises the Linux
      # implementations (fanotify EDR sensor, /proc forensics, patchmgr)
      # that the cross-compile steps above only prove compile.
      - name: Test (linux, CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./cmd/aftersecd/... ./cmd/aftersec/... ./pkg/...

  darwin-vet:
    name: macOS vet (no CGO deps)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Checkout darkscan
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DARKSCAN_REPO }}
          token: ${{ secrets.DARKSCAN_TOKEN }}
          path: darkscan-local

      - name: Remap darkscan replace directive
        run: go mod edit -replace github.com/afterdarksys/darkscan=./darkscan-local

      # CGO_ENABLED=0 skips unicorn/clamav/yara packages that need brew deps.
      # Full GUI build requires those headers; run locally or in a release job.
      - name: Vet (darwin, CGO_ENABLED=0)
        run: CGO_ENABLED=0 go vet ./cmd/aftersecd/... ./cmd/aftersec/... ./pkg/...

  windows-minimal:
    name: Windows minimal posture scanner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test scanner and compliance executor
        run: go test ./cmd/aftersec-windows ./pkg/compliance
      - name: Build minimal scanner
        run: go build -o aftersec-windows.exe ./cmd/aftersec-windows
      - name: Smoke usage and scan JSON
        shell: powershell
        run: |
          & .\aftersec-windows.exe bogus
          if ($LASTEXITCODE -ne 2) { throw "expected usage exit 2, got $LASTEXITCODE" }
          $stdout = Join-Path $env:TEMP 'aftersec-windows-scan.json'
          $stderr = Join-Path $env:TEMP 'aftersec-windows-scan.err'
          $exe = Join-Path (Get-Location) 'aftersec-windows.exe'
          $p = Start-Process -FilePath $exe -ArgumentList 'scan' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1) { throw "unexpected exit $($p.ExitCode): $(Get-Content $stderr -Raw)" }
          $results = Get-Content $stdout -Raw | ConvertFrom-Json
          if (@($results).Count -ne 2) { throw "expected 2 checks, got $(@($results).Count)" }
          foreach ($r in $results) {
            if (-not $r.name) { throw "missing check name" }
          }
